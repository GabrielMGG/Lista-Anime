spring.application.name=anime-mood

# conexion com MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/anime_mood
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Optional official catalog. Kept exclusively on the server.
myanimelist.client-id=${MAL_CLIENT_ID:}
